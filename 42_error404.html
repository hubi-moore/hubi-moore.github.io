<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>42 Bites – Nie znaleziono strony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #F7F3EC;
      --forest:  #2D4A2D;
      --bark:    #8B5A2B;
      --mustard: #C8943A;
      --mist:    #E8E0D0;
    }

    body {
      background: var(--cream);
      color: var(--forest);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    .bg-number {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    .bg-number span {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(280px, 40vw, 520px);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--mist);
      letter-spacing: -0.04em;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .paw-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px dashed var(--mist);
      animation: spin 18s linear infinite;
    }

    .orbit::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mustard);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .paw-icon {
      width: 64px;
      height: 64px;
      animation: breathe 3.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(0.92); opacity: 0.8; }
    }

    .label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mustard);
      margin-bottom: 0.9rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      color: var(--forest);
      margin-bottom: 1rem;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--bark);
    }

    .sub {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #4a6240;
      text-align: center;
      max-width: 360px;
      margin-bottom: 3rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s, border-color 0.18s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-solid {
      background: var(--forest);
      color: var(--cream);
      border: 1.5px solid var(--forest);
    }
    .btn-solid:hover { background: var(--bark); border-color: var(--bark); }

    .btn-outline {
      background: transparent;
      color: var(--forest);
      border: 1.5px solid var(--mist);
    }
    .btn-outline:hover { border-color: var(--bark); color: var(--bark); }

    .pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--mist);
      font-size: 0.8rem;
      color: #4a6240;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      background: transparent;
    }
    .pill:hover {
      background: var(--forest);
      color: var(--cream);
      border-color: var(--forest);
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit, .paw-icon { animation: none; }
    }
  </style>
</head>
