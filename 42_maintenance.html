<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>42 Bites – Chwilowa przerwa techniczna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #F7F3EC;
      --forest:  #2D4A2D;
      --bark:    #8B5A2B;
      --mustard: #C8943A;
      --mist:    #E8E0D0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--cream);
      color: var(--forest);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      overflow: hidden;
    }

    /* Textured background — subtle paw print grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
            /*background-image: url("data:image/svg+xml, %3Csvg class='paw' width='90' height='90' opacity='0.06' viewBox='0 0 48.839 48.839' xmlns='http://www.w3.org/2000/svg' aria-hidden='true'%3E%3Cpath fill='%232D4A2D' d='M39.041,36.843c2.054,3.234,3.022,4.951,3.022,6.742c0,3.537-2.627,5.252-6.166,5.252 c-1.56,0-2.567-0.002-5.112-1.326c0,0-1.649-1.509-5.508-1.354c-3.895-0.154-5.545,1.373-5.545,1.373 c-2.545,1.323-3.516,1.309-5.074,1.309c-3.539,0-6.168-1.713-6.168-5.252c0-1.791,0.971-3.506,3.024-6.742 c0,0,3.881-6.445,7.244-9.477c2.43-2.188,5.973-2.18,5.973-2.18h1.093v-0.001c0,0,3.698-0.009,5.976,2.181 C35.059,30.51,39.041,36.844,39.041,36.843z M16.631,20.878c3.7,0,6.699-4.674,6.699-10.439S20.331,0,16.631,0 S9.932,4.674,9.932,10.439S12.931,20.878,16.631,20.878z M10.211,30.988c2.727-1.259,3.349-5.723,1.388-9.971 s-5.761-6.672-8.488-5.414s-3.348,5.723-1.388,9.971C3.684,29.822,7.484,32.245,10.211,30.988z M32.206,20.878 c3.7,0,6.7-4.674,6.7-10.439S35.906,0,32.206,0s-6.699,4.674-6.699,10.439C25.507,16.204,28.506,20.878,32.206,20.878z M45.727,15.602c-2.728-1.259-6.527,1.165-8.488,5.414s-1.339,8.713,1.389,9.972c2.728,1.258,6.527-1.166,8.488-5.414 S48.455,16.861,45.727,15.602z'/%3E%3C/svg%3E");*/
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    /* Animated paw icon */
    .paw {
      width: 88px;
      height: 88px;
      margin: 0 auto 2rem;
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.07); }
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mustard);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--forest);
      margin-bottom: 1.25rem;
    }

    h1 em {
      font-style: italic;
      color: var(--bark);
    }

    .desc {
      font-size: 1rem;
      line-height: 1.7;
      color: #4a6240;
      max-width: 420px;
      margin: 0 auto 2.5rem;
    }

    /* Progress bar */
    .progress-wrap {
      background: var(--mist);
      border-radius: 999px;
      height: 6px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 0.6rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 72%;
      background: linear-gradient(90deg, var(--forest), var(--mustard));
      border-radius: 999px;
      animation: progress-glow 2.5s ease-in-out infinite alternate;
    }
    @keyframes progress-glow {
      from { opacity: 0.75; }
      to   { opacity: 1; }
    }
    .progress-label {
      font-size: 0.72rem;
      color: var(--bark);
      letter-spacing: 0.05em;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--mist);
      margin: 2.5rem auto;
      width: 200px;
    }

    .notify-label {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bark);
      margin-bottom: 0.75rem;
    }

    .notify-form {
      display: flex;
      gap: 0.5rem;
      max-width: 380px;
      margin: 0 auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    .notify-form input {
      flex: 1 1 200px;
      padding: 0.65rem 1rem;
      border: 1.5px solid var(--mist);
      border-radius: 6px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--forest);
      outline: none;
      transition: border-color 0.2s;
    }
    .notify-form input:focus {
      border-color: var(--mustard);
    }
    .notify-form input::placeholder { color: #aaa; }

    .notify-form button {
      padding: 0.65rem 1.4rem;
      background: var(--forest);
      color: var(--cream);
      border: none;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .notify-form button:hover { background: var(--bark); }
    .notify-form button:active { transform: scale(0.97); }

    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #94a08a;
    }
    .footer-note a {
      color: var(--bark);
      text-decoration: none;
    }
    .footer-note a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .paw, .progress-bar { animation: none; }
    }
  </style>
</head>
<body>

<div class="card">

  </svg>

  <p class="eyebrow">42 Bites · Psi świat gryzienia</p>

  <h1>Wrócimy<br><em>lada chwila</em></h1>

  <p class="desc">
    Nasz sklep jest chwilowo na przerwie technicznej — właśnie pakujemy nowe gryzaki i szykujemy kilka niespodzianek dla Twojego Pupila. Wróć za chwilę!
  </p>

  <div class="progress-wrap">
    <div class="progress-bar"></div>
  </div>
  <p class="progress-label">prace w toku…</p>

  <hr class="divider">

  <p class="footer-note">
    Pytania? Napisz na <a href="mailto:kontakt@42bites.pl">kontakt@42bites.pl</a>
    lub zadzwoń: <a href="tel:+48889478306">+48 889 478 306</a>
  </p>

</div>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Zapisano ✓';
    btn.style.background = '#C8943A';
    btn.disabled = true;
    e.target.querySelector('input').disabled = true;
  }
</script>

</body>
</html>
